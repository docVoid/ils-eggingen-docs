server {
    listen 80;
    root /usr/share/nginx/html;

    location ~ /\.(git|github) { deny all; return 404; }
    location = /docker-compose.yml { deny all; return 404; }
    location ^~ /deploy/ { deny all; return 404; }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Startseite: kein Dateiname in der URL. Direktes try_files statt der
    # automatischen "index"-Direktive, sonst kollidiert deren interner
    # Redirect mit den Regeln unten (Redirect-Loop).
    location = / {
        try_files /index.html =404;
    }
    location = /index.html {
        return 301 /doku/;
    }

    # Interner Zielpfad fuer error_page, nicht direkt aufrufbar
    location = /404.html {
        internal;
    }

    # Alte .html-URLs dauerhaft auf die sprechenden URLs umleiten
    location ~ ^/(.+)\.html$ {
        return 301 /doku/$1;
    }

    # Saubere URLs ohne Dateiendung
    location / {
        try_files $uri $uri.html =404;
    }

    error_page 404 =404 /404.html;
}

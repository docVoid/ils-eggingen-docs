server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location ~ /\.(git|github) { deny all; return 404; }
    location = /docker-compose.yml { deny all; return 404; }
    location ^~ /deploy/ { deny all; return 404; }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # /index.html -> / (Startseite hat keinen eigenen "Dateinamen" in der URL)
    location = /index.html {
        return 301 /;
    }

    # Interner Ziel-Pfad für error_page, nicht direkt aufrufbar
    location = /404.html {
        internal;
    }

    # Alte .html-URLs dauerhaft auf die sprechenden URLs umleiten
    location ~ ^/(.+)\.html$ {
        return 301 /$1;
    }

    # Saubere URLs ohne Dateiendung
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 =404 /404.html;
}

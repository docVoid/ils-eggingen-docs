name: Deploy Doku

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, ils-docs-pi]
    steps:
      - uses: actions/checkout@v4

      # Container mountet dieses Checkout-Verzeichnis direkt (read-only) als Docroot,
      # neue Inhalte sind sofort da – up -d greift nur bei Compose-/Image-Änderungen.
      - name: Container aktuell halten
        run: docker compose up -d --remove-orphans
